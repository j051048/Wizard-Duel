<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 360" width="256" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0891b2" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="256" height="360" rx="12" fill="url(#bg)"/>
  <rect width="256" height="360" rx="12" fill="url(#glow)"/>
  <!-- Border -->
  <rect x="2" y="2" width="252" height="356" rx="10" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Top decorative bar -->
  <rect x="10" y="10" width="236" height="3" rx="1.5" fill="#67e8f9" opacity="0.8"/>
  <!-- Center icon area -->
  <circle cx="128" cy="140" r="60" fill="#0891b2" opacity="0.3" filter="url(#shadow)"/>
  <text x="128" y="155" text-anchor="middle" font-size="60">❄️</text>
  <!-- Card name -->
  <rect x="20" y="260" width="216" height="32" rx="6" fill="black" fill-opacity="0.5"/>
  <text x="128" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="sans-serif">冰晶龙</text>
  <!-- ID watermark -->
  <text x="128" y="340" text-anchor="middle" font-size="10" fill="white" fill-opacity="0.3" font-family="monospace">ice20</text>
</svg>